services:

  - type: web
    name: openfga-server
    runtime: image
    image:
      url: openfga/openfga:latest
    dockerCommand: run
    preDeployCommand: migrate
    plan: starter
    envVars:
      - key: OPENFGA_DATASTORE_ENGINE
        value: postgres
      - key: OPENFGA_DATASTORE_URI
        sync: false # set manually in Render dashboard to your Neon connection string
      - key: OPENFGA_LOG_FORMAT
        value: json
      - key: OPENFGA_CORS_ALLOWED_ORIGINS
        value: https://cloudcoreapp.netlify.app # replace with your real frontend URL(s), comma-separated
      - key: OPENFGA_PLAYGROUND_ENABLED
        value: "false" # recommended off in production
    healthCheckPath: /healthz
    numInstances: 1